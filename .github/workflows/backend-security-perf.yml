name: 3. Seguridad y Rendimiento - Astramaco III

on:
  push:
    branches: [ "main", "develop", "final-trabajo" ]
  pull_request:
    branches: [ "main", "develop", "final-trabajo" ]

jobs:
  security-and-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Instalar Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Dar permisos a Maven
        run: chmod +x mvnw

      - name: Iniciar Aplicación Spring Boot en segundo plano
        env:
          APP_JWT_SECRET: EstaEsUnaClaveJWTDePruebasMuyLargaSeguraParaAstramacoIII2026Valida123456789
          SPRING_PROFILES_ACTIVE: test
        run: |
          ./mvnw spring-boot:run &
          echo "Esperando a que el backend se levante en el puerto 8080..."
          until $(curl --output /dev/null --silent --head --fail http://localhost:8080/v3/api-docs); do
              printf '.'
              sleep 5
          done
          echo " Backend corriendo."

      - name: Escáner de Seguridad con Nmap
        run: |
          echo "=== Iniciando escaneo de puertos y servicios ==="
          nmap -sV -p 8080 localhost

      - name: Prueba de Estrés con k6
        # --network host permite al contenedor de k6 acceder al localhost del servidor de GitHub
        run: |
          echo "=== Iniciando simulación de carga ==="
          docker run --rm --network host -i grafana/k6 run - < ./src/test/resources/k6/script.js || true

      - name: Detener Aplicación
        run: curl -X POST http://localhost:8080/actuator/shutdown || kill $(lsof -t -i:8080) || true